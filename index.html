<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Floor Map</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.18);
      --border: rgba(148, 163, 184, 0.2);
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.01em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    input, select, button {
      font: inherit;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
    }

    button {
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 120ms ease;
    }

    button:hover {
      border-color: var(--accent);
      background: #3b4d66;
    }

    button.active, [aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #e0f2fe;
    }

    .search-wrap {
      position: relative;
    }

    .results {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 260px;
      max-height: 280px;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      z-index: 30;
    }

    .results.open { display: block; }

    .result-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .result-item:last-child { border-bottom: 0; }
    .result-item:hover { background: var(--accent-soft); }

    .layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
      padding: 16px;
      max-width: 1440px;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    .stage {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      min-height: 460px;
      position: relative;
      overflow: auto;
    }

    .room {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      margin: 6px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.35);
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
    }

    .room:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 6px 18px rgba(56, 189, 248, 0.2);
    }

    .room.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
    }

    .inspector {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      height: fit-content;
    }

    .muted { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Campus &amp; Floor Map</div>
    <div class="controls">
      <div class="search-wrap">
        <input id="q" type="search" placeholder="Search room or class..." autocomplete="off" aria-label="Search rooms" />
        <div id="results" class="results" role="listbox"></div>
      </div>

      <select id="floorSelect" aria-label="Select floor"></select>

      <select id="labelMode" aria-label="Label display mode">
        <option value="both">Code + Name</option>
        <option value="code">Room Code</option>
        <option value="name">Class Name</option>
      </select>

      <button id="prevRoom" type="button" title="Previous room (P)">Prev</button>
      <button id="nextRoom" type="button" title="Next room (N)">Next</button>
      <button id="resetView" type="button">Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage" aria-label="Floor plan canvas"></section>
    <aside class="inspector" id="inspector" aria-live="polite">
      <h2>Room Details</h2>
      <p class="muted">Select a room on the map or search above to inspect details.</p>
    </aside>
  </main>

  <script>
    const PREF_KEY = "github_floor_map_prefs_v1";

    // Replace with your full floor/room dataset
    const DATA = {
      floors: [
        {
          id: "floor-1",
          name: "Ground Floor",
          rooms: [
            { id: "r101", code: "101", name: "Intro to Computing", capacity: 35, notes: "Near main entrance" },
            { id: "r102", code: "102", name: "Applied Math", capacity: 30, notes: "Projector & whiteboard" },
            { id: "r103", code: "103", name: "Design Studio", capacity: 24, notes: "Worktables & plotters" }
          ]
        }
      ]
    };

    const state = {
      floorId: DATA.floors[0]?.id || "",
      labelMode: "both",
      selectedRoomId: null
    };

    function loadPrefs() {
      try {
        const saved = JSON.parse(localStorage.getItem(PREF_KEY) || "{}");
        if (saved.floorId && DATA.floors.some(f => f.id === saved.floorId)) state.floorId = saved.floorId;
        if (["both", "code", "name"].includes(saved.labelMode)) state.labelMode = saved.labelMode;
        if (saved.selectedRoomId) state.selectedRoomId = saved.selectedRoomId;
      } catch (_) {}
    }

    function savePrefs() {
      try {
        localStorage.setItem(PREF_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function getCurrentFloor() {
      return DATA.floors.find(f => f.id === state.floorId) || DATA.floors[0];
    }

    function formatRoomLabel(room) {
      if (state.labelMode === "code") return room.code;
      if (state.labelMode === "name") return room.name;
      return `${room.code} · ${room.name}`;
    }

    function renderFloorSelect() {
      const sel = document.getElementById("floorSelect");
      sel.innerHTML = DATA.floors
        .map(f => `<option value="${f.id}" ${f.id === state.floorId ? "selected" : ""}>${f.name}</option>`)
        .join("");
    }

    function renderInspector(room) {
      const el = document.getElementById("inspector");
      if (!room) {
        el.innerHTML = `<h2>Room Details</h2><p class="muted">Select a room on the map or search above to inspect details.</p>`;
        return;
      }
      el.innerHTML = `
        <h2>${room.code} — ${room.name}</h2>
        <p><strong>Capacity:</strong> ${room.capacity ?? "—"}</p>
        <p><strong>Notes:</strong> ${room.notes ?? "None"}</p>
      `;
    }

    function renderStage() {
      const stage = document.getElementById("stage");
      const floor = getCurrentFloor();
      if (!floor) return;

      stage.innerHTML = `<h3>${floor.name}</h3>` + floor.rooms.map(room => {
        const selected = room.id === state.selectedRoomId ? "selected" : "";
        return `
          <button type="button" class="room ${selected}" data-room-id="${room.id}">
            <strong>${formatRoomLabel(room)}</strong>
          </button>
        `;
      }).join("");

      const selectedRoom = floor.rooms.find(r => r.id === state.selectedRoomId) || null;
      renderInspector(selectedRoom);
    }

    function selectRoom(roomId) {
      state.selectedRoomId = roomId;
      savePrefs();
      renderStage();
    }

    function stepRoom(delta) {
      const floor = getCurrentFloor();
      if (!floor || !floor.rooms.length) return;
      const idx = floor.rooms.findIndex(r => r.id === state.selectedRoomId);
      const nextIdx = idx === -1 ? 0 : (idx + delta + floor.rooms.length) % floor.rooms.length;
      selectRoom(floor.rooms[nextIdx].id);
    }

    document.getElementById("stage").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-room-id]");
      if (btn) selectRoom(btn.dataset.roomId);
    });

    document.getElementById("floorSelect").addEventListener("change", (e) => {
      state.floorId = e.target.value;
      state.selectedRoomId = null;
      savePrefs();
      renderStage();
    });

    document.getElementById("labelMode").addEventListener("change", (e) => {
      state.labelMode = e.target.value;
      savePrefs();
      renderStage();
    });

    document.getElementById("prevRoom").addEventListener("click", () => stepRoom(-1));
    document.getElementById("nextRoom").addEventListener("click", () => stepRoom(1));

    document.getElementById("resetView").addEventListener("click", () => {
      state.selectedRoomId = null;
      document.getElementById("q").value = "";
      document.getElementById("results").classList.remove("open");
      savePrefs();
      renderStage();
    });

    const qInput = document.getElementById("q");
    const resultsEl = document.getElementById("results");

    qInput.addEventListener("input", () => {
      const term = qInput.value.trim().toLowerCase();
      if (!term) {
        resultsEl.classList.remove("open");
        resultsEl.innerHTML = "";
        return;
      }

      const matches = [];
      for (const floor of DATA.floors) {
        for (const room of floor.rooms) {
          if (room.code.toLowerCase().includes(term) || room.name.toLowerCase().includes(term)) {
            matches.push({ floor, room });
          }
        }
      }

      resultsEl.innerHTML = matches.length
        ? matches.map(({ floor, room }) => `
            <button type="button" class="result-item" data-floor="${floor.id}" data-room="${room.id}">
              <span><strong>${room.code}</strong> · ${room.name}</span>
              <span class="muted">${floor.name}</span>
            </button>
          `).join("")
        : `<div class="muted" style="padding:10px 12px;">No matching rooms</div>`;

      resultsEl.classList.add("open");
    });

    resultsEl.addEventListener("click", (e) => {
      const item = e.target.closest("[data-room]");
      if (!item) return;
      state.floorId = item.dataset.floor;
      state.selectedRoomId = item.dataset.room;
      resultsEl.classList.remove("open");
      savePrefs();
      renderFloorSelect();
      renderStage();
    });

    document.addEventListener("keydown", (e) => {
      if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) {
        if (e.key === "Escape") {
          qInput.value = "";
          resultsEl.classList.remove("open");
        }
        return;
      }
      if (e.key === "n" || e.key === "N") stepRoom(1);
      if (e.key === "p" || e.key === "P") stepRoom(-1);
    });

    loadPrefs();
    renderFloorSelect();
    document.getElementById("labelMode").value = state.labelMode;
    renderStage();
  </script>
</body>
</html>
